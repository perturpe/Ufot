<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Site background color -->
    <radialGradient id="bg" cx="50%" cy="44%" r="60%">
      <stop offset="0%"   stop-color="#0d0d1a"/>
      <stop offset="55%"  stop-color="#080810"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>

    <!-- Border: purple -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Disc body -->
    <linearGradient id="discTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1a2e"/>
      <stop offset="55%"  stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>

    <!-- Disc sheen — purple -->
    <linearGradient id="discSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <!-- Dome -->
    <radialGradient id="domeGrad" cx="38%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#13132a"/>
      <stop offset="60%"  stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#080810"/>
    </radialGradient>

    <!-- Dome window glow — purple -->
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <!-- Tractor beam — purple -->
    <linearGradient id="beamCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="60%"  stop-color="#a78bfa" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient halo -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ambient" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="mid" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="beamBlur" x="-30%" y="0%" width="160%" height="110%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="clip"><circle cx="200" cy="200" r="193"/></clipPath>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="200" r="198" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="196" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="188" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.07"/>

  <!-- Stars -->
  <g clip-path="url(#clip)">
    <circle cx="48"  cy="58"  r="1"   fill="#fff" opacity=".45"/>
    <circle cx="348" cy="44"  r="1.4" fill="#fff" opacity=".65"/>
    <circle cx="82"  cy="170" r="0.9" fill="#fff" opacity=".4"/>
    <circle cx="362" cy="145" r="1"   fill="#fff" opacity=".5"/>
    <circle cx="325" cy="290" r="1.1" fill="#fff" opacity=".38"/>
    <circle cx="58"  cy="325" r="0.9" fill="#fff" opacity=".55"/>
    <circle cx="125" cy="68"  r="0.8" fill="#fff" opacity=".42"/>
    <circle cx="302" cy="362" r="0.9" fill="#fff" opacity=".48"/>
    <circle cx="370" cy="338" r="1.1" fill="#fff" opacity=".5"/>
    <circle cx="84"  cy="376" r="0.8" fill="#fff" opacity=".38"/>
    <circle cx="190" cy="38"  r="0.9" fill="#fff" opacity=".6"/>
    <circle cx="290" cy="54"  r="0.8" fill="#fff" opacity=".42"/>
    <circle cx="375" cy="222" r="0.9" fill="#fff" opacity=".32"/>
    <circle cx="20"  cy="242" r="0.8" fill="#fff" opacity=".45"/>
    <circle cx="384" cy="108" r="0.9" fill="#fff" opacity=".5"/>
    <circle cx="140" cy="382" r="0.9" fill="#fff" opacity=".38"/>
    <circle cx="355" cy="388" r="0.8" fill="#fff" opacity=".42"/>
    <!-- Brighter stars -->
    <circle cx="308" cy="96"  r="1.7" fill="#fff"    opacity=".82"/>
    <circle cx="114" cy="282" r="1.3" fill="#ddd6fe" opacity=".65"/>
    <circle cx="38"  cy="144" r="1.1" fill="#ede9fe" opacity=".55"/>
    <circle cx="365" cy="68"  r="1.5" fill="#ffffff"  opacity=".42"/>
    <circle cx="260" cy="42"  r="0.7" fill="#fff" opacity=".32"/>
    <circle cx="266" cy="38"  r="0.5" fill="#fff" opacity=".25"/>
    <circle cx="256" cy="36"  r="0.5" fill="#fff" opacity=".28"/>
  </g>

  <!-- Ambient halo -->
  <ellipse cx="200" cy="215" rx="145" ry="55" fill="url(#halo)" filter="url(#ambient)"/>

  <!-- Tractor beam -->
  <path d="M158,238 L242,238 L298,368 L102,368 Z" fill="url(#beamOuter)" filter="url(#beamBlur)"/>
  <path d="M172,238 L228,238 L262,340 L138,340 Z" fill="url(#beamCore)" opacity="0.55"/>
  <line x1="200" y1="238" x2="200" y2="345" stroke="#a78bfa" stroke-width="1" opacity="0.15"/>

  <!-- Disc shadow -->
  <ellipse cx="200" cy="244" rx="124" ry="13" fill="#050508" opacity="0.98"/>

  <!-- Disc body -->
  <ellipse cx="200" cy="230" rx="128" ry="21" fill="url(#discTop)"/>
  <ellipse cx="200" cy="225" rx="128" ry="13" fill="url(#discSheen)"/>

  <!-- Disc rim lines -->
  <ellipse cx="200" cy="220" rx="128" ry="10" fill="none" stroke="#a78bfa" stroke-width="1.8" opacity=".55"/>
  <ellipse cx="200" cy="220" rx="120" ry="7"  fill="none" stroke="#a78bfa" stroke-width="0.6" opacity=".18"/>
  <ellipse cx="200" cy="240" rx="118" ry="8"  fill="none" stroke="#2a2a4a" stroke-width="1.2" opacity=".6"/>

  <!-- Disc soft glow -->
  <ellipse cx="200" cy="230" rx="128" ry="21" fill="#a78bfa" opacity=".06" filter="url(#mid)"/>

  <!-- Rim lights — purple main, with yellow accent (site's "light" sighting color) -->
  <circle cx="200" cy="226" r="3.8"  fill="#a78bfa" opacity="1"   filter="url(#glow)"/>
  <circle cx="172" cy="227" r="3.2"  fill="#a78bfa" opacity=".9"  filter="url(#glow)"/>
  <circle cx="228" cy="227" r="3.2"  fill="#a78bfa" opacity=".9"  filter="url(#glow)"/>
  <circle cx="148" cy="231" r="2.6"  fill="#7c3aed" opacity=".75"/>
  <circle cx="252" cy="231" r="2.6"  fill="#7c3aed" opacity=".75"/>
  <circle cx="126" cy="236" r="2.1"  fill="#6d28d9" opacity=".6"/>
  <circle cx="274" cy="236" r="2.1"  fill="#6d28d9" opacity=".6"/>
  <!-- Yellow accent (matches site's "light" dot color) -->
  <circle cx="186" cy="226" r="2.6"  fill="#ffe066" opacity=".8"  filter="url(#glow)"/>
  <circle cx="214" cy="226" r="2.6"  fill="#ffe066" opacity=".8"  filter="url(#glow)"/>

  <!-- Dome -->
  <path d="M96,228 Q96,144 200,136 Q304,144 304,228 Z" fill="url(#domeGrad)"/>
  <path d="M96,228 Q96,144 200,136 Q304,144 304,228 Z" fill="none" stroke="#a78bfa" stroke-width="1.4" opacity=".26"/>
  <path d="M115,228 Q115,152 200,146 Q285,152 285,228" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity=".1"/>

  <!-- Dome window — purple glow -->
  <ellipse cx="200" cy="188" rx="28" ry="20" fill="#080810"/>
  <ellipse cx="200" cy="188" rx="28" ry="20" fill="url(#windowGlow)" opacity=".3"/>
  <ellipse cx="200" cy="188" rx="28" ry="20" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity=".62"/>
  <ellipse cx="200" cy="188" rx="12" ry="8"  fill="#a78bfa" opacity=".18" filter="url(#mid)"/>
  <ellipse cx="192" cy="182" rx="6"  ry="4"  fill="#a78bfa" opacity=".14" transform="rotate(-20 192 182)"/>

  <!-- Dome reflection -->
  <path d="M122,216 Q132,180 155,168" stroke="#a78bfa" stroke-width="1.4" fill="none" opacity=".1" stroke-linecap="round"/>

  <!-- Under-disc pulse -->
  <ellipse cx="200" cy="250" rx="96"  ry="9" fill="#a78bfa" opacity=".14" filter="url(#mid)"/>
  <ellipse cx="200" cy="252" rx="120" ry="8" fill="none" stroke="#a78bfa" stroke-width="1" opacity=".09"/>
</svg>
