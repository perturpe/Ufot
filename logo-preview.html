<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>UFO Tracker — Logo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #080810;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 56px;
    padding: 60px 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .label {
    color: #4b5563;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 16px;
    text-align: center;
  }
  .row { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; justify-content: center; }
  .col { display: flex; flex-direction: column; align-items: center; }

  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(167,139,250,0.12);
    border: 1px solid rgba(167,139,250,0.35);
    color: #a78bfa;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 999px;
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: background 0.2s, border-color 0.2s;
    cursor: pointer;
  }
  .download-btn:hover {
    background: rgba(167,139,250,0.2);
    border-color: rgba(167,139,250,0.6);
  }
  .download-btn svg { opacity: 0.8; }
</style>
</head>
<body>

<!-- ── ICON MARK 300px ── -->
<div class="col">
  <div class="label">Icon mark — 300px</div>
  <img src="public/logo.svg" width="300" height="300" alt="UFO Tracker logo" style="border-radius:50%;">
</div>

<!-- ── SIZES ── -->
<div class="col">
  <div class="label">Sizes</div>
  <div class="row">
    <div class="col">
      <img src="public/logo.svg" width="128" height="128" alt="" style="border-radius:50%;">
      <div class="label" style="margin-top:10px;margin-bottom:0">128px</div>
    </div>
    <div class="col">
      <img src="public/logo.svg" width="64" height="64" alt="" style="border-radius:50%;">
      <div class="label" style="margin-top:10px;margin-bottom:0">64px</div>
    </div>
    <div class="col">
      <img src="public/logo.svg" width="32" height="32" alt="" style="border-radius:50%;">
      <div class="label" style="margin-top:10px;margin-bottom:0">32px</div>
    </div>
  </div>
</div>

<!-- ── HORIZONTAL LOCKUP ── -->
<div class="col">
  <div class="label">Horizontal lockup</div>
  <div style="display:flex;align-items:center;gap:14px;background:#0d0d1a;border:1px solid #2a2a4a;border-radius:16px;padding:18px 26px;">
    <img src="public/logo.svg" width="52" height="52" alt="" style="border-radius:50%;box-shadow:0 0 20px rgba(167,139,250,0.3);">
    <div>
      <div style="color:#a78bfa;font-size:22px;font-weight:800;letter-spacing:-0.02em;line-height:1;">UFO</div>
      <div style="color:#4b5563;font-size:12px;font-weight:500;letter-spacing:0.22em;margin-top:2px;">TRACKER</div>
    </div>
  </div>
</div>

<!-- ── ON LIGHT BG ── -->
<div class="col">
  <div class="label">On light background</div>
  <div style="display:flex;align-items:center;gap:14px;background:#f0f0f4;padding:18px 26px;border-radius:16px;">
    <img src="public/logo.svg" width="52" height="52" alt="" style="border-radius:50%;">
    <div>
      <div style="color:#1e1b4b;font-size:22px;font-weight:800;letter-spacing:-0.02em;line-height:1;">UFO</div>
      <div style="color:#6b7280;font-size:12px;font-weight:500;letter-spacing:0.22em;margin-top:2px;">TRACKER</div>
    </div>
  </div>
</div>

<!-- ── DOWNLOAD ── -->
<div class="col">
  <div class="label">Download</div>
  <button class="download-btn" onclick="downloadLogo()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Download SVG
  </button>
</div>

<script>
function downloadLogo() {
  const svg = `<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="60%"><stop offset="0%" stop-color="#0d0d1a"/><stop offset="55%" stop-color="#080810"/><stop offset="100%" stop-color="#050508"/></radialGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/><stop offset="50%" stop-color="#a78bfa" stop-opacity="0.12"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4"/></linearGradient>
    <linearGradient id="discTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1a2e"/><stop offset="55%" stop-color="#0d0d1a"/><stop offset="100%" stop-color="#080810"/></linearGradient>
    <linearGradient id="discSheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.12"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
    <radialGradient id="domeGrad" cx="38%" cy="30%" r="65%"><stop offset="0%" stop-color="#13132a"/><stop offset="60%" stop-color="#0d0d1a"/><stop offset="100%" stop-color="#080810"/></radialGradient>
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/><stop offset="60%" stop-color="#a78bfa" stop-opacity="0.3"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <linearGradient id="beamCore" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/><stop offset="60%" stop-color="#a78bfa" stop-opacity="0.1"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
    <linearGradient id="beamOuter" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.16"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="ambient" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="mid" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="beamBlur" x="-30%" y="0%" width="160%" height="110%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clip"><circle cx="200" cy="200" r="193"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="198" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="196" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="188" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.07"/>
  <g clip-path="url(#clip)">
    <circle cx="48" cy="58" r="1" fill="#fff" opacity=".45"/><circle cx="348" cy="44" r="1.4" fill="#fff" opacity=".65"/><circle cx="82" cy="170" r="0.9" fill="#fff" opacity=".4"/><circle cx="362" cy="145" r="1" fill="#fff" opacity=".5"/><circle cx="325" cy="290" r="1.1" fill="#fff" opacity=".38"/><circle cx="58" cy="325" r="0.9" fill="#fff" opacity=".55"/><circle cx="125" cy="68" r="0.8" fill="#fff" opacity=".42"/><circle cx="302" cy="362" r="0.9" fill="#fff" opacity=".48"/><circle cx="370" cy="338" r="1.1" fill="#fff" opacity=".5"/><circle cx="84" cy="376" r="0.8" fill="#fff" opacity=".38"/><circle cx="190" cy="38" r="0.9" fill="#fff" opacity=".6"/><circle cx="290" cy="54" r="0.8" fill="#fff" opacity=".42"/><circle cx="375" cy="222" r="0.9" fill="#fff" opacity=".32"/><circle cx="20" cy="242" r="0.8" fill="#fff" opacity=".45"/><circle cx="384" cy="108" r="0.9" fill="#fff" opacity=".5"/><circle cx="140" cy="382" r="0.9" fill="#fff" opacity=".38"/><circle cx="355" cy="388" r="0.8" fill="#fff" opacity=".42"/><circle cx="308" cy="96" r="1.7" fill="#fff" opacity=".82"/><circle cx="114" cy="282" r="1.3" fill="#ddd6fe" opacity=".65"/><circle cx="38" cy="144" r="1.1" fill="#ede9fe" opacity=".55"/><circle cx="365" cy="68" r="1.5" fill="#ffffff" opacity=".42"/><circle cx="260" cy="42" r="0.7" fill="#fff" opacity=".32"/><circle cx="266" cy="38" r="0.5" fill="#fff" opacity=".25"/><circle cx="256" cy="36" r="0.5" fill="#fff" opacity=".28"/>
  </g>
  <ellipse cx="200" cy="215" rx="145" ry="55" fill="url(#halo)" filter="url(#ambient)"/>
  <path d="M158,238 L242,238 L298,368 L102,368 Z" fill="url(#beamOuter)" filter="url(#beamBlur)"/>
  <path d="M172,238 L228,238 L262,340 L138,340 Z" fill="url(#beamCore)" opacity="0.55"/>
  <line x1="200" y1="238" x2="200" y2="345" stroke="#a78bfa" stroke-width="1" opacity="0.15"/>
  <ellipse cx="200" cy="244" rx="124" ry="13" fill="#050508" opacity="0.98"/>
  <ellipse cx="200" cy="230" rx="128" ry="21" fill="url(#discTop)"/>
  <ellipse cx="200" cy="225" rx="128" ry="13" fill="url(#discSheen)"/>
  <ellipse cx="200" cy="220" rx="128" ry="10" fill="none" stroke="#a78bfa" stroke-width="1.8" opacity=".55"/>
  <ellipse cx="200" cy="220" rx="120" ry="7" fill="none" stroke="#a78bfa" stroke-width="0.6" opacity=".18"/>
  <ellipse cx="200" cy="240" rx="118" ry="8" fill="none" stroke="#2a2a4a" stroke-width="1.2" opacity=".6"/>
  <ellipse cx="200" cy="230" rx="128" ry="21" fill="#a78bfa" opacity=".06" filter="url(#mid)"/>
  <circle cx="200" cy="226" r="3.8" fill="#a78bfa" opacity="1" filter="url(#glow)"/>
  <circle cx="172" cy="227" r="3.2" fill="#a78bfa" opacity=".9" filter="url(#glow)"/>
  <circle cx="228" cy="227" r="3.2" fill="#a78bfa" opacity=".9" filter="url(#glow)"/>
  <circle cx="148" cy="231" r="2.6" fill="#7c3aed" opacity=".75"/>
  <circle cx="252" cy="231" r="2.6" fill="#7c3aed" opacity=".75"/>
  <circle cx="126" cy="236" r="2.1" fill="#6d28d9" opacity=".6"/>
  <circle cx="274" cy="236" r="2.1" fill="#6d28d9" opacity=".6"/>
  <circle cx="186" cy="226" r="2.6" fill="#ffe066" opacity=".8" filter="url(#glow)"/>
  <circle cx="214" cy="226" r="2.6" fill="#ffe066" opacity=".8" filter="url(#glow)"/>
  <path d="M96,228 Q96,144 200,136 Q304,144 304,228 Z" fill="url(#domeGrad)"/>
  <path d="M96,228 Q96,144 200,136 Q304,144 304,228 Z" fill="none" stroke="#a78bfa" stroke-width="1.4" opacity=".26"/>
  <path d="M115,228 Q115,152 200,146 Q285,152 285,228" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity=".1"/>
  <ellipse cx="200" cy="188" rx="28" ry="20" fill="#080810"/>
  <ellipse cx="200" cy="188" rx="28" ry="20" fill="url(#windowGlow)" opacity=".3"/>
  <ellipse cx="200" cy="188" rx="28" ry="20" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity=".62"/>
  <ellipse cx="200" cy="188" rx="12" ry="8" fill="#a78bfa" opacity=".18" filter="url(#mid)"/>
  <ellipse cx="192" cy="182" rx="6" ry="4" fill="#a78bfa" opacity=".14" transform="rotate(-20 192 182)"/>
  <path d="M122,216 Q132,180 155,168" stroke="#a78bfa" stroke-width="1.4" fill="none" opacity=".1" stroke-linecap="round"/>
  <ellipse cx="200" cy="250" rx="96" ry="9" fill="#a78bfa" opacity=".14" filter="url(#mid)"/>
  <ellipse cx="200" cy="252" rx="120" ry="8" fill="none" stroke="#a78bfa" stroke-width="1" opacity=".09"/>
</svg>`;

  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const size = 800;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, size, size);
    URL.revokeObjectURL(url);
    canvas.toBlob(pngBlob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(pngBlob);
      a.download = 'ufo-tracker-logo.png';
      a.click();
    }, 'image/png');
  };
  img.src = url;
}
</script>

</body>
</html>
